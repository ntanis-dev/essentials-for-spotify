name: CI

on:
  push:
    paths:
      - .npmrc
      - assets/**
      - com.ntanis.essentials-for-spotify.sdPlugin/**
      - ntanis.project.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - rollup.config.mjs
      - scripts/**
      - src/**
      - THIRD-PARTY-ASSETS.md
      - tsconfig.json
      - LICENSE
      - THIRD-PARTY-NOTICES.md
      - .github/workflows/**
      - .github/CODEOWNERS
      - SECURITY.md
  pull_request:
    paths:
      - .npmrc
      - assets/**
      - com.ntanis.essentials-for-spotify.sdPlugin/**
      - ntanis.project.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - rollup.config.mjs
      - scripts/**
      - src/**
      - THIRD-PARTY-ASSETS.md
      - tsconfig.json
      - LICENSE
      - THIRD-PARTY-NOTICES.md
      - .github/workflows/**
      - .github/CODEOWNERS
      - SECURITY.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ntanis-dev/ci/.github/workflows/project-validate.yml@8eddb78e4bb7da81fd9b34b863ced0e6661dfc1e
    with:
      project: essentials-for-spotify
