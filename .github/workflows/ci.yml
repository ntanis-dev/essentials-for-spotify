name: CI

on:
  push:
    paths:
      - .npmrc
      - assets/**
      - com.ntanis.essentials-for-spotify.sdPlugin/**
      - ntanis.project.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - rollup.config.mjs
      - scripts/**
      - src/**
      - THIRD-PARTY-ASSETS.md
      - tsconfig.json
      - LICENSE
      - THIRD-PARTY-NOTICES.md
      - .github/workflows/**
      - .github/CODEOWNERS
      - renovate.json
      - SECURITY.md
  pull_request:
    paths:
      - .npmrc
      - assets/**
      - com.ntanis.essentials-for-spotify.sdPlugin/**
      - ntanis.project.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - rollup.config.mjs
      - scripts/**
      - src/**
      - THIRD-PARTY-ASSETS.md
      - tsconfig.json
      - LICENSE
      - THIRD-PARTY-NOTICES.md
      - .github/workflows/**
      - .github/CODEOWNERS
      - renovate.json
      - SECURITY.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ntanis-dev/ci/.github/workflows/project-validate.yml@9c8ba3d5a09e618cda7d59bead50c73f8812924d
    with:
      project: essentials-for-spotify
