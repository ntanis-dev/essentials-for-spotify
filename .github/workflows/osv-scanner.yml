name: Dependency Vulnerability Scan

on:
  # Pushes and pull requests scan when a lockfile changes; the weekly run catches advisories published since for
  # dependencies that did not change.
  pull_request:
    branches: [main]
    paths:
      - "**/pnpm-lock.yaml"
      - "**/osv-scanner.toml"
      - ".github/workflows/osv-scanner.yml"
  push:
    branches: [main]
    paths:
      - "**/pnpm-lock.yaml"
      - "**/osv-scanner.toml"
      - ".github/workflows/osv-scanner.yml"
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pull-request:
    name: Reject newly introduced vulnerabilities
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        -r
        ./
      fail-on-vuln: true
      upload-sarif: false

  scan-full-tree:
    name: Scan the complete dependency tree
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        -r
        ./
      fail-on-vuln: true
      upload-sarif: false
