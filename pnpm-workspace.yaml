packages: []

overrides:
  lodash: 4.18.1
  # GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr: all fixed in 2.1.7.
  brace-expansion: 2.1.7
  # GHSA-58mr-gqgx-xq4g, GHSA-qw65-cvwx-89v3, GHSA-hrr3-gc8f-f4qj: all fixed in 3.1.8.
  fast-uri: 3.1.8

# New direct and transitive versions must mature for two weeks before they can
# enter the lockfile. Emergency exceptions must name one exact locked version.
minimumReleaseAge: 20160
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
trustLockfile: false
blockExoticSubdeps: true
saveExact: true
injectWorkspacePackages: true

# Lifecycle scripts fail closed. Replace the empty map only with reviewed,
# exact-version package selectors and document why execution is required.
strictDepBuilds: true
verifyDepsBeforeRun: error
allowBuilds: {}
