<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="cache-control" content="no-cache">
	<title>Stream Overlay | Essentials for Spotify</title>
	<link rel="stylesheet" href="style.css">
	<link rel="shortcut icon" href="logo.png" />
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
	<div id="overlay">
		<div id="album-art-container">
			<img id="album-art" src="" alt="" />
		</div>
		<div id="info">
			<div id="song-name"><span></span></div>
			<div id="artist-name"><span></span></div>
			<div id="progress-container">
				<div id="progress-bar">
					<div id="progress-fill"></div>
				</div>
				<div id="time">
					<span id="time-current">0:00</span>
					<span id="time-total">0:00</span>
				</div>
			</div>
		</div>
		<img src="spotify-logo.svg" alt="Spotify" id="brand-spotify" />
		<img src="logo.png" alt="" id="brand-logo" />
		<div id="idle-message">
			<svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
				<path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
			</svg>
		</div>
	</div>

	<script src="script.js"></script>
</body>
</html>
