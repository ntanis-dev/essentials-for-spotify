<!doctype html>
<html>
    <head lang="en">
        <meta charset="utf-8" />
        <script src="sdpi-components.js"></script>
        <script src="locales.js"></script>

        <style>
            body {
                -webkit-user-select: none;
                user-select: none;
            }
        </style>
    </head>
    <body>
        <sdpi-item label="Display Style">
            <sdpi-select setting="dial_style">
                <option value="spotify">Orignal</option>
                <option value="dialmix">DialMix</option>
            </sdpi-select>
        </sdpi-item>

        <sdpi-item label="DialMix Name">
            <sdpi-textfield setting="dialmix_name" placeholder="Optional custom name"></sdpi-textfield>
        </sdpi-item>

        <sdpi-item label="DialMix Icon">
            <sdpi-textfield id="dialmix_icon" setting="dialmix_icon" placeholder="SVG or PNG data URL"></sdpi-textfield>
            <input id="dialmix_icon_file" type="file" accept=".svg,.png,image/svg+xml,image/png" />
        </sdpi-item>

        <sdpi-item label="__MSG_Step %__">
            <sdpi-range
                setting="step"
                min="1"
                max="20"
                step="1"
                showlabels>
            </sdpi-range>
        </sdpi-item>

        <sdpi-item label="__MSG_Action__">
            <sdpi-select setting="push_action">
                <option value="mute">__MSG_Volume Mute / Unmute__</option>
                <option value="play_pause">__MSG_Play / Pause__</option>
            </sdpi-select>
        </sdpi-item>

        <script src="localize.js"></script>
        <script src="dialmix-settings.js"></script>
    </body>
</html>
